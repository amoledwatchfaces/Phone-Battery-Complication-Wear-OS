name: CI/CD Build & Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APKs
        run: ./gradlew assembleDebug

  release:
    name: Publish Release (CD)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Decode Keystore
        run: |
          if [ ! -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "${{ github.workspace }}/release.jks"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.jks" >> $GITHUB_ENV
          else
            echo "No release keystore secret found, falling back to debug signature."
          fi

      - name: Build Release APKs & AABs
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Clean Up Keystore File
        run: rm -f "${{ github.workspace }}/release.jks"

      - name: Prepare Release Artifacts
        run: |
          mkdir staging
          
          # Copy Wear OS binaries if they exist
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk staging/phone-battery-complication-wear.apk
          fi
          if [ -f wear/build/outputs/bundle/release/wear-release.aab ]; then
            cp wear/build/outputs/bundle/release/wear-release.aab staging/phone-battery-complication-wear.aab
          fi
          
          # Copy Mobile Companion binaries if they exist
          if [ -f mobile/build/outputs/apk/release/mobile-release.apk ]; then
            cp mobile/build/outputs/apk/release/mobile-release.apk staging/phone-battery-complication-mobile.apk
          fi
          if [ -f mobile/build/outputs/bundle/release/mobile-release.aab ]; then
            cp mobile/build/outputs/bundle/release/mobile-release.aab staging/phone-battery-complication-mobile.aab
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            staging/phone-battery-complication-wear.apk
            staging/phone-battery-complication-wear.aab
            staging/phone-battery-complication-mobile.apk
            staging/phone-battery-complication-mobile.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
